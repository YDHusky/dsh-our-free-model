name: publish-docker

on:
  push:
    branches:
      - docker-openai-proxy
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.yudream.online
  IMAGE_NAME: library/dsh-our-free-model-proxy

jobs:
  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test the proxy entry point
        run: |
          npm run test:proxy
          node scripts/standalone-package-test.mjs --sources-only

      - name: Prepare the runtime image context
        run: node scripts/build-proxy-image-context.mjs "$RUNNER_TEMP/proxy-context"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the image registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/docker-openai-proxy' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build OCI image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ runner.temp }}/proxy-context
          file: ./Dockerfile.ci
          push: false
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RUNTIME_BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:667e04372713ff135c359b4bdd2a468e00f355073b4a2adb4ded47faacfb9da2
          outputs: type=oci,dest=${{ runner.temp }}/proxy-image.tar
          provenance: false

      - name: Push only missing OCI blobs
        id: push
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/proxy-image.tar
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: python3 .github/scripts/push-oci-image.py

      - name: Publish summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo '## Published image'
            echo
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
            echo
            echo "Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
